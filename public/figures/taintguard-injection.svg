<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Without TaintGuard the injected transfer runs; with it the call is blocked">
<rect width="1200" height="560" fill="#0a0a0c"/>
<g stroke="#ffffff" stroke-width="1" opacity="0.03"><line x1="0" y1="0" x2="0" y2="560"/><line x1="40" y1="0" x2="40" y2="560"/><line x1="80" y1="0" x2="80" y2="560"/><line x1="120" y1="0" x2="120" y2="560"/><line x1="160" y1="0" x2="160" y2="560"/><line x1="200" y1="0" x2="200" y2="560"/><line x1="240" y1="0" x2="240" y2="560"/><line x1="280" y1="0" x2="280" y2="560"/><line x1="320" y1="0" x2="320" y2="560"/><line x1="360" y1="0" x2="360" y2="560"/><line x1="400" y1="0" x2="400" y2="560"/><line x1="440" y1="0" x2="440" y2="560"/><line x1="480" y1="0" x2="480" y2="560"/><line x1="520" y1="0" x2="520" y2="560"/><line x1="560" y1="0" x2="560" y2="560"/><line x1="600" y1="0" x2="600" y2="560"/><line x1="640" y1="0" x2="640" y2="560"/><line x1="680" y1="0" x2="680" y2="560"/><line x1="720" y1="0" x2="720" y2="560"/><line x1="760" y1="0" x2="760" y2="560"/><line x1="800" y1="0" x2="800" y2="560"/><line x1="840" y1="0" x2="840" y2="560"/><line x1="880" y1="0" x2="880" y2="560"/><line x1="920" y1="0" x2="920" y2="560"/><line x1="960" y1="0" x2="960" y2="560"/><line x1="1000" y1="0" x2="1000" y2="560"/><line x1="1040" y1="0" x2="1040" y2="560"/><line x1="1080" y1="0" x2="1080" y2="560"/><line x1="1120" y1="0" x2="1120" y2="560"/><line x1="1160" y1="0" x2="1160" y2="560"/><line x1="1200" y1="0" x2="1200" y2="560"/><line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="440" x2="1200" y2="440"/><line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="520" x2="1200" y2="520"/><line x1="0" y1="560" x2="1200" y2="560"/></g>
<rect x="0" y="0" width="7" height="560" fill="#34d399"/>
<text x="44" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8b8b94" text-anchor="start">$ python examples/injection_demo.py</text>
<text x="44" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#5c5c66" text-anchor="start">an assistant reads a supplier email; the email carries an injected instruction</text>
<rect x="44" y="116" width="528" height="396" rx="12" fill="#141419" stroke="#2a2a33" stroke-width="1.5"/>
<text x="68" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#f4f4f5" text-anchor="start" font-weight="600">without TaintGuard</text>
<text x="68" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8b8b94" text-anchor="start">▸ get_invoice(invoice_id='INV-2026-08')</text>
<text x="68" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8b8b94" text-anchor="start">▸ search_docs(query='outstanding balance')</text>
<text x="68" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#f87171" text-anchor="start">▸ transfer_money(</text>
<text x="84" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#f87171" text-anchor="start">to_account='988-7712', amount=49000.0)</text>
<text x="68" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5c5c66" text-anchor="start">the injected account is just another string</text>
<text x="68" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5c5c66" text-anchor="start">by the time it reaches the tool</text>
<line x1="68" y1="406" x2="548" y2="406" stroke="#2a2a33" stroke-width="1"/>
<text x="68" y="436" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5c5c66" text-anchor="start">balance</text>
<text x="68" y="464" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" fill="#f87171" text-anchor="start" font-weight="600">71,000.00</text>
<text x="548" y="464" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#f87171" text-anchor="end" font-weight="600">−49,000.00</text>
<rect x="604" y="116" width="528" height="396" rx="12" fill="#141419" stroke="#34d399" stroke-width="1.5"/>
<text x="628" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#f4f4f5" text-anchor="start" font-weight="600">with TaintGuard</text>
<text x="628" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#34d399" text-anchor="start" font-weight="600">ALLOW</text>
<text x="700" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8b8b94" text-anchor="start">get_invoice</text>
<text x="628" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#34d399" text-anchor="start" font-weight="600">ALLOW</text>
<text x="700" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8b8b94" text-anchor="start">search_docs</text>
<text x="628" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#f87171" text-anchor="start" font-weight="600">BLOCK</text>
<text x="700" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#f4f4f5" text-anchor="start">transfer_money</text>
<text x="700" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#f87171" text-anchor="start">tainted_argument</text>
<text x="700" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#5c5c66" text-anchor="start">to_account was derived from untrusted content</text>
<text x="700" y="329" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#5c5c66" text-anchor="start">(email:4821). Tools at CRITICAL risk cannot</text>
<text x="700" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#5c5c66" text-anchor="start">use attacker-controllable values.</text>
<line x1="628" y1="406" x2="1108" y2="406" stroke="#2a2a33" stroke-width="1"/>
<text x="628" y="436" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5c5c66" text-anchor="start">balance</text>
<text x="628" y="464" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" fill="#34d399" text-anchor="start" font-weight="600">120,000.00</text>
<text x="1108" y="464" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#34d399" text-anchor="end" font-weight="600">−0.00</text>
</svg>
